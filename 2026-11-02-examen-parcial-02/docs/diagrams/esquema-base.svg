oke:#000;stroke-width:1;"/></g><text x="368.63" y="249.43" fill="#000" font-size="14" textLength="197.613">number : INT UNSIGNED «PK»</text><line x1="349.63" y1="256.397" x2="571.243" y2="256.397" style="stroke:#181818;stroke-width:1;"/><text x="354.63" y="273.529" fill="#000" font-size="14" textLength="192.186">supplier_cuit : CHAR(11) «FK»</text><text x="354.63" y="289.628" fill="#000" font-size="14" textLength="115.165">created_at : DATE</text><text x="354.63" y="305.726" fill="#000" font-size="14" textLength="161.854">expected_delivery : DATE</text></g><!--class items--><g class="entity" data-qualified-name="items" id="ent0004" data-source-line="26"><rect x="643.56" y="388.689" width="289.751" height="112.395" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><ellipse cx="714.538" cy="404.689" rx="11" ry="11" fill="#ADD1B2" style="stroke:#181818;stroke-width:1;"/><path d="M711.038,411.189 L711.038,398.782 L718.475,398.782 L718.475,400.642 L713.131,400.642 L713.131,403.876 L717.881,403.876 L717.881,405.673 L713.131,405.673 L713.131,409.314 L718.475,409.314 L718.475,411.189 L711.038,411.189 Z " fill="#000"/><text x="735.038" y="409.771" fill="#000" font-size="14" textLength="139.296">purchase_order_items</text><line x1="644.56" y1="420.689" x2="932.311" y2="420.689" style="stroke:#181818;stroke-width:0.5;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="654.56" cy="434.238" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="663.56" y="437.82" fill="#000" font-size="14" textLength="263.751">order_number : INT UNSIGNED «PK, FK»</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="654.56" cy="450.337" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="663.56" y="453.919" fill="#000" font-size="14" textLength="244.316">article_code : VARCHAR(20) «PK, FK»</text><line x1="644.56" y1="460.886" x2="932.311" y2="460.886" style="stroke:#181818;stroke-width:1;"/><text x="649.56" y="478.018" fill="#000" font-size="14" textLength="161.041">quantity : INT UNSIGNED</text><text x="649.56" y="494.116" fill="#000" font-size="14" textLength="206.172">position : SMALLINT UNSIGNED</text></g><g class="entity" data-qualified-name="GMN8" id="ent0009" data-source-line="39"><path d="M265.12,64.249 L265.12,80.199 L230.1,84.199 L265.12,88.199 L265.12,104.146 A0,0 0 0 0 265.12,104.146 L565.741,104.146 A0,0 0 0 0 565.741,104.146 L565.741,74.249 L555.741,64.249 L265.12,64.249 A0,0 0 0 0 265.12,64.249" style="stroke:#181818;stroke-width:0.5;" fill="#E8F0FE"/><path d="M555.741,64.249 L555.741,74.249 L565.741,74.249 L555.741,64.249" style="stroke:#181818;stroke-width:0.5;" fill="#E8F0FE"/><text x="271.12" y="81.442" fill="#000" font-size="13" textLength="44.795" font-weight="700">BR-004</text><text x="319.527" y="81.442" fill="#000" font-size="13" textLength="231.213">— el CUIT es la clave: 11 dígitos, único.</text><text x="271.12" y="96.391" fill="#000" font-size="13" textLength="256.566">Se guarda sin guiones, igual que se ingresa.</text></g><g class="entity" data-qualified-name="GMN11" id="ent0012" data-source-line="44"><path d="M923.25,229.069 L923.25,252.499 L888.56,256.499 L923.25,260.499 L923.25,283.915 A0,0 0 0 0 923.25,283.915 L1229.622,283.915 A0,0 0 0 0 1229.622,283.915 L1229.622,239.069 L1219.622,229.069 L923.25,229.069 A0,0 0 0 0 923.25,229.069" style="stroke:#181818;stroke-width:0.5;" fill="#E8F0FE"/><path d="M1219.622,229.069 L1219.622,239.069 L1229.622,239.069 L1219.622,229.069" style="stroke:#181818;stroke-width:0.5;" fill="#E8F0FE"/><text x="929.25" y="246.262" fill="#000" font-size="13" textLength="100.426" font-weight="700">BR-002 / BR-003</text><text x="1033.288" y="246.262" fill="#000" font-size="13" textLength="156.089">— código único y no vacío;</text><text x="929.25" y="261.211" fill="#000" font-size="13" textLength="285.372">precio en centavos (`BIGINT`), nunca `DOUBLE`.</text><text x="929.25" y="276.16" fill="#000" font-size="13" textLength="186.761">`CHECK (unit_price_cents > 0)`.</text></g><g class="entity" data-qualified-name="GMN14" id="ent0015" data-source-line="50"><path d="M150.02,405.989 L150.02,483.784 A0,0 0 0 0 150.02,483.784 L608.85,483.784 A0,0 0 0 0 608.85,483.784 L608.85,415.989 L598.85,405.989 L400.06,405.989 L436.24,313.169 L392.06,405.989 L150.02,405.989 A0,0 0 0 0 150.02,405.989" style="stroke:#181818;stroke-width:0.5;" fill="#E8F0FE"/><path d="M598.85,405.989 L598.85,415.989 L608.85,415.989 L598.85,405.989" style="stroke:#181818;stroke-width:0.5;" fill="#E8F0FE"/><text x="156.02" y="423.182" fill="#000" font-size="13" textLength="44.795" font-weight="700">BR-011</text><text x="204.427" y="423.182" fill="#000" font-size="13" textLength="275.285">— `CHECK (expected_delivery >= created_at)`.</text><line x1="151.02" y1="425.937" x2="607.85" y2="425.937" style="stroke:#181818;stroke-width:1;stroke-dasharray:1,2;"/><text x="156.02" y="442.131" fill="#000" font-size="13" textLength="44.795" font-weight="700">BR-010</text><text x="204.427" y="442.131" fill="#000" font-size="13" textLength="297">— el número lo asigna la aplicación antes del insert</text><text x="156.02" y="457.08" fill="#000" font-size="13" textLength="437.83">(`OrderNumberSequence`), no `AUTO_INCREMENT`: el agregado necesita</text><text x="156.02" y="472.029" fill="#000" font-size="13" textLength="376.486">su número para validarse. El seed inserta 1..3 y el siguiente es 4.</text></g><g class="entity" data-qualified-name="GMN17" id="ent0018" data-source-line="58"><path d="M588.97,562.089 L588.97,685.781 A0,0 0 0 0 588.97,685.781 L987.897,685.781 A0,0 0 0 0 987.897,685.781 L987.897,572.089 L977.897,562.089 L792.43,562.089 L788.43,501.419 L784.43,562.089 L588.97,562.089 A0,0 0 0 0 588.97,562.089" style="stroke:#181818;stroke-width:0.5;" fill="#E8F4EA"/><path d="M977.897,562.089 L977.897,572.089 L987.897,572.089 L977.897,562.089" style="stroke:#181818;stroke-width:0.5;" fill="#E8F4EA"/><text x="594.97" y="579.282" fill="#000" font-size="13" textLength="44.795" font-weight="700">BR-008</text><text x="643.377" y="579.282" fill="#000" font-size="13" textLength="322.962">— la clave primaria `(order_number, article_code)` hace</text><text x="594.97" y="594.231" fill="#000" font-size="13" textLength="341.783">imposible cargar el mismo artículo dos veces en un pedido.</text><line x1="589.97" y1="596.986" x2="986.897" y2="596.986" style="stroke:#181818;stroke-width:1;stroke-dasharray:1,2;"/><text x="594.97" y="613.18" fill="#000" font-size="13" textLength="44.795" font-weight="700">BR-001</text><text x="643.377" y="613.18" fill="#000" font-size="13" textLength="154.235">— `CHECK (quantity > 0)`.</text><line x1="589.97" y1="619.935" x2="986.897" y2="619.935" style="stroke:#181818;stroke-width:1;stroke-dasharray:1,2;"/><text x="594.97" y="636.129" fill="#000" font-size="13" textLength="324.46">`position` preserva el orden de carga que exige RN-007.</text><line x1="589.97" y1="642.884" x2="986.897" y2="642.884" style="stroke:#181818;stroke-width:1;stroke-dasharray:1,2;"/><text x="594.97" y="659.077" fill="#000" font-size="13" textLength="40.473">Es una</text><text x="639.054" y="659.077" fill="#000" font-size="13" textLength="88.112" font-weight="700">tabla de unión</text><text x="727.166" y="659.077" fill="#000" font-size="13" textLength="245.73">, no una entidad de línea: ADR-0002 sigue</text><text x="594.97" y="674.026" fill="#000" font-size="13" textLength="257.264">vigente y el dominio no gana un `OrderLine`.</text></g><g class="entity" data-qualified-name="GMN20" id="ent0021" data-source-line="70"><path d="M601.17,56.779 L601.17,111.625 A0,0 0 0 0 601.17,111.625 L744.62,111.625 L571.94,199.969 L752.62,111.625 L1003.69,111.625 A0,0 0 0 0 1003.69,111.625 L1003.69,66.779 L993.69,56.779 L601.17,56.779 A0,0 0 0 0 601.17,56.779" style="stroke:#181818;stroke-width:0.5;" fill="#FFF2CC"/><path d="M993.69,56.779 L993.69,66.779 L1003.69,66.779 L993.69,56.779" style="stroke:#181818;stroke-width:0.5;" fill="#FFF2CC"/><text x="607.17" y="73.972" fill="#000" font-size="13" textLength="349.724">Solo `suppliers` se modifica y se elimina desde la aplicación.</text><text x="607.17" y="88.921" fill="#000" font-size="13" textLength="381.52">`purchase_orders` es *append-only* y `articles` es de solo lectura:</text><text x="607.17" y="103.87" fill="#000" font-size="13" textLength="263.745">el seed es su única fuente (RN-011, RN-018).</text></g><!--link suppliers to orders--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk5" data-source-line="34" data-link-type="crowfoot"><path d="M204.921,128.264 C249.811,150.614 283.398,167.334 332.728,191.904" style="stroke:#181818;stroke-width:1;" fill="none" id="suppliers-orders" codeLine="34"/><line x1="199.558" y1="130.062" x2="203.124" y2="122.901" style="stroke:#181818;stroke-width:1;"/><line x1="202.243" y1="131.399" x2="205.809" y2="124.238" style="stroke:#181818;stroke-width:1;"/><line x1="204.921" y1="128.264" x2="197.76" y2="124.699" style="stroke:#181818;stroke-width:1;"/><line x1="341.679" y1="196.362" x2="351.515" y2="194.558" style="stroke:#181818;stroke-width:1;"/><line x1="341.679" y1="196.362" x2="346.165" y2="205.299" style="stroke:#181818;stroke-width:1;"/><line x1="341.679" y1="196.362" x2="348.84" y2="199.929" style="stroke:#181818;stroke-width:1;"/><ellipse cx="336.308" cy="193.687" rx="4" ry="4" fill="none" style="stroke:#181818;stroke-width:1;"/><text x="280.18" y="167.492" fill="#000" font-size="13" textLength="35.407">recibe</text></g><!--link orders to items--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk6" data-source-line="35" data-link-type="crowfoot"><path d="M565.355,317.121 C607.165,340.881 641.944,360.647 683.734,384.387" style="stroke:#181818;stroke-width:1;" fill="none" id="orders-items" codeLine="35"/><line x1="559.901" y1="318.623" x2="563.854" y2="311.667" style="stroke:#181818;stroke-width:1;"/><line x1="562.51" y1="320.105" x2="566.462" y2="313.15" st